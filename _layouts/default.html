{% comment %}
  The one layout. It stays style-agnostic: it pulls the active style from
  site.style (set in _config.yml) and pulls in that style's head, footer, and
  page body from _includes/themes/<style>/. Switching the whole site's look is
  a one-line change in _config.yml. `data-style` on <html> also lets a future
  client-side switcher flip styles without a rebuild.
{% endcomment %}<!DOCTYPE html>
<html lang="en" data-style="{{ site.style }}">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">

	{% comment %} Style-specific fonts + stylesheet. {% endcomment %}
	{% assign style_head = "themes/" | append: site.style | append: "/head.html" %}
	{% include {{ style_head }} %}

	<meta name="google-site-verification" content="0fztkvlNfAiD5jqlEyucza5vrVMAk3sTSEPB_tbcl2A">

	{% seo %}
</head>

<body>
	<header>
		{% include nav.html %}
	</header>
	<main>
		<div class="container">

			{% comment %}
			  A page sets `body:` in its front matter to name its content block
			  (home / research / contact). The active style provides the matching
			  template under themes/<style>/. Pages with no `body:` (e.g. blog,
			  posts) just render their own {{ content }}.
			{% endcomment %}
			{% if page.body %}
				{% assign style_body = "themes/" | append: site.style | append: "/" | append: page.body | append: ".html" %}
				{% include {{ style_body }} %}
			{% else %}
				{{ content }}
			{% endif %}

		</div><!-- /.container -->
	</main>
	{% assign style_footer = "themes/" | append: site.style | append: "/footer.html" %}
	{% include {{ style_footer }} %}

	{% comment %} Hover-to-expand abstracts on the publications list. Style-
	agnostic and self-contained; no-ops on pages without publication entries. {% endcomment %}
	<script defer src="/js/pub-abstracts.js"></script>
</body>

</html>
