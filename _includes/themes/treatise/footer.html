<script>
	(function () {
		var btn = document.querySelector('.theme-toggle');
		if (!btn) return;
		function sync() {
			btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'Day' : 'Night';
		}
		sync();
		btn.addEventListener('click', function () {
			var goingDark = document.documentElement.getAttribute('data-theme') !== 'dark';
			if (goingDark) {
				document.documentElement.setAttribute('data-theme', 'dark');
				localStorage.setItem('treatise-theme', 'dark');
			} else {
				document.documentElement.removeAttribute('data-theme');
				localStorage.setItem('treatise-theme', 'light');
			}
			sync();
		});
	})();
</script>
