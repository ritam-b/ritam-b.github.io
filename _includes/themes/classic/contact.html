{% comment %} "classic" contact page — content from _data/profile.yml. {% endcomment %}
<div class="blurb">
	<h1>{{ page.title }}</h1>
	{% for item in site.data.profile.contact %}
	<p><em>{{ item.label }}:</em> {% if item.email %}{{ item.email }}{% else %}{{ item.value }}{% endif %}</p>
	{% endfor %}
</div><!-- /.blurb -->
